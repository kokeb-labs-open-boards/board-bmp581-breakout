---
# Requirements: what the board shall do, each testable. Chip facts come from the driver's docs/hardware.yml
# (kokeb-labs-drivers/driver-bmp581), which cites BMP581 datasheet revision 1.13 for each; the section and page are
# given where a requirement relies on one. All are draft: nothing is approved until a reviewer who did not write
# them has checked them against the datasheet.
- id: R-001
  title: Every driver-visible signal is reachable
  statement: >-
    The board shall bring VDD, VDDIO, GND, SCK, SDI, SDO, CSB and INT of the BMP581 to a header, so that both I2C and
    four-wire SPI operation, and the interrupt output, can be connected without rework.
  rationale: >-
    N-001 needs the driver to run over either bus on the real chip. The pins and their roles are listed in
    driver-bmp581 docs/hardware.yml (datasheet 6.1, Table 28, p. 46).
  kind: electrical
  derives_from:
    - {id: N-001, ver: 1}
  status: draft
  version: 1
  classification: public
- id: R-002
  title: Bus selection without rework
  statement: >-
    The board shall let the user choose I2C or four-wire SPI with jumpers or straps only. In I2C mode CSB shall be
    held at VDDIO from power-up, and SDO shall be tied to VSS or VDDIO to set the address and never left open.
  rationale: >-
    The chip selects its protocol from CSB at power-up (datasheet 5.1, p. 31) and takes its I2C address from SDO
    (datasheet 5.6, p. 38), as driver-bmp581 docs/hardware.yml records.
  kind: electrical
  derives_from:
    - {id: N-001, ver: 1}
  status: draft
  version: 1
  classification: public
- id: R-003
  title: Supplies stay within the datasheet range
  statement: >-
    The board shall keep VDD and VDDIO within the ranges the datasheet gives (1.71 V to 3.6 V and 1.08 V to 3.6 V),
    from power-up to power-down, for every supply and host configuration the board documents.
  rationale: >-
    Out-of-range supply damages the chip or gives readings that cannot be trusted. Limits: datasheet Table 4, p. 10,
    via driver-bmp581 docs/hardware.yml. The control for hazard H-001.
  kind: electrical
  derives_from:
    - {id: N-001, ver: 1}
  status: draft
  version: 1
  classification: public
- id: R-004
  title: The driver runs unmodified
  statement: >-
    driver-bmp581 shall run on the board's documented host without changes to the driver, using only a bus port class
    and a pin map that this repository provides.
  rationale: >-
    The purpose of N-001 is to verify the driver on hardware; a patched driver would verify something else.
  kind: software
  derives_from:
    - {id: N-001, ver: 1}
  status: draft
  version: 1
  classification: public
- id: R-005
  title: The release states its verification status
  statement: >-
    Each release shall list, for every requirement, whether it is verified, planned, failed or waived, and link the
    evidence for those verified. Anything not verified on hardware shall say so.
  rationale: N-002 asks for evidence before reliance. The trace report and the evidence pack provide it.
  kind: documentation
  derives_from:
    - {id: N-002, ver: 1}
  status: draft
  version: 1
  classification: public
- id: R-006
  title: Header with a documented pin order
  statement: >-
    The board shall carry one single-row 2.54 mm header with all eight signals of R-001 in a documented order, marked
    on the silkscreen, so that it fits a breadboard and a standard cable.
  rationale: >-
    N-003. 2.54 mm is the common pitch of breadboards and development-board headers (ADR-0002). A wrong or unlabelled
    order is a way to connect the board backwards (H-005).
  kind: electrical
  derives_from:
    - {id: N-003, ver: 1}
    - {id: R-001, ver: 1}
  status: draft
  version: 1
  classification: public
- id: R-007
  title: Plug-in I2C connectors
  statement: >-
    The board shall carry two 4-pin 1.0 mm connectors in the Qwiic and STEMMA QT order (GND, 3.3 V, SDA, SCL),
    wired in parallel so that boards can be chained, supplying the 3.3 V rail only.
  rationale: >-
    N-003. A plug-in cable removes soldering for the common I2C case (ADR-0002). The connector order is to be checked
    against the published Qwiic specification before this requirement is approved.
  kind: electrical
  derives_from:
    - {id: N-003, ver: 1}
  status: draft
  version: 1
  classification: public
- id: R-008
  title: Single 3.3 V or 5 V supply
  statement: >-
    The board shall run from one 3.3 V supply, and from a 5 V supply through an onboard regulator, the source being
    chosen by a solder jumper, and shall keep VDD within the range of R-003 in both cases.
  rationale: >-
    N-004. Typical development boards offer 3.3 V and 5 V; the chip allows 1.71 V to 3.6 V on VDD (ADR-0003).
  kind: electrical
  derives_from:
    - {id: N-004, ver: 1}
    - {id: R-003, ver: 1}
  status: draft
  version: 1
  classification: public
- id: R-009
  title: VDDIO can be supplied separately
  statement: >-
    The board shall let VDDIO be tied to VDD by default and be supplied from its own header pin instead, by a solder
    jumper, so that a host with logic below 3.3 V can be used.
  rationale: >-
    N-004. The chip takes VDD and VDDIO in any order and VDDIO down to 1.08 V (driver-bmp581 docs/hardware.yml,
    datasheet Table 4, p. 10).
  kind: electrical
  derives_from:
    - {id: N-004, ver: 1}
    - {id: R-003, ver: 1}
  status: draft
  version: 1
  classification: public
- id: R-010
  title: Supply and logic limits are marked
  statement: >-
    The silkscreen and the documentation shall state the allowed VDD and VDDIO range and that logic above VDDIO
    must not be connected, and the documentation shall say what a 5 V host needs.
  rationale: >-
    The board has no level shifter in its base variant (ADR-0003), so a 5 V logic host would exceed the limits of
    R-003. The control for H-002.
  kind: documentation
  derives_from:
    - {id: N-004, ver: 1}
    - {id: R-003, ver: 1}
  status: draft
  version: 1
  classification: public
- id: R-011
  title: The pressure port is open
  statement: >-
    The board shall leave the sensor port unobstructed by parts, solder mask, labels or mounting hardware, and shall
    keep heat sources, such as the regulator, away from the sensor, shown by the layout rules and a thermal analysis.
  rationale: >-
    N-005. A blocked port or a warm neighbour gives a wrong reading that looks plausible (H-003). The port position and
    the keep-out come from the datasheet package drawing (to be cited when the footprint is reviewed).
  kind: mechanical
  derives_from:
    - {id: N-005, ver: 1}
  status: draft
  version: 1
  classification: public
- id: R-012
  title: Mounting holes
  statement: >-
    The board shall have two non-plated mounting holes for M2.5 screws at positions given in a drawing in the release
    package, clear of the sensor port and of every signal.
  rationale: N-005. See ADR-0005 for the screw size and why two holes suffice.
  kind: mechanical
  derives_from:
    - {id: N-005, ver: 1}
  status: draft
  version: 1
  classification: public
- id: R-013
  title: Small outline
  statement: >-
    The board outline shall not exceed 25.4 mm by 20.3 mm, the size of an eight-pin header row plus the connectors,
    unless an ADR records why it must.
  rationale: >-
    N-003 and N-005. A small board fits fixtures and breadboards. The limit is a provisional budget from ADR-0002 and
    is confirmed or changed by the first layout.
  kind: mechanical
  derives_from:
    - {id: N-003, ver: 1}
    - {id: N-005, ver: 1}
  status: draft
  version: 1
  classification: public
- id: R-014
  title: Design and reasons are published
  statement: >-
    Each release shall include the KiCad source, the schematic PDF, the ADRs that explain the choices and the reference
    circuit with every deviation from the datasheet figures marked.
  rationale: N-006. An integrator reuses a design only if they can see why it is the way it is.
  kind: documentation
  derives_from:
    - {id: N-006, ver: 1}
  status: draft
  version: 1
  classification: public
- id: R-015
  title: Buildable from the release
  statement: >-
    Each release shall include Gerbers, drill, bill of materials, placement and assembly drawings, and the bill of
    materials shall name the manufacturer part number, lifecycle status and an alternate for every line.
  rationale: N-007. See manufacturing/README.md for the release package.
  kind: manufacturing
  derives_from:
    - {id: N-007, ver: 1}
  status: draft
  version: 1
  classification: public
- id: R-016
  title: Known default configuration
  statement: >-
    As shipped, the board shall be set to I2C at address 0x47 with INT on the header, and every change from that
    default shall be made by a documented solder jumper.
  rationale: >-
    N-008. A fixed default makes a test repeatable. 0x47 is the address with SDO at VDDIO, i2c::kI2cAddressSdoHigh in
    the driver (driver-bmp581 docs/hardware.yml).
  kind: electrical
  derives_from:
    - {id: N-008, ver: 1}
    - {id: R-002, ver: 1}
  status: draft
  version: 1
  classification: public
- id: R-017
  title: A board can be matched to its record
  statement: >-
    Each board shall carry its name and revision on the silkscreen, so that a physical board can be matched to the
    release, its errata and its evidence.
  rationale: N-002. A result is only evidence for the revision it was measured on.
  kind: manufacturing
  derives_from:
    - {id: N-002, ver: 1}
  status: draft
  version: 1
  classification: public
